# Render deployment note:
# A standard Render web service cannot reach Ollama on your laptop (127.0.0.1).
# For cloud hosting, set OLLAMA_URL to a separately hosted Ollama-compatible endpoint
# running an open-weight model, or use Option A (local demo) documented in README.md.
services:
  - type: web
    name: trailquest-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: trailquest_db
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: gemma3:4b
