services:
  - type: web
    name: trailquest-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434/api/generate
